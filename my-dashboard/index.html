<!DOCTYPE html>
<html lang="zh-CN">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width,initial-scale=1.0">
        <title>大学自习室开关状态以及时间</title>
        <link href="libs/bootstrap.min.css" rel="stylesheet">
        <style>
            .chart-box{height: 360px;}
            #status{display: none;}
        </style>
    </head>
    <body class="container py-4">
        <header>
            <h1 class="h3">大学自习室开关状态以及时间</h1>
            <p class="text-muted" id="sub-title"> 数据来源：课程统一数据集</p>
        </header>
        <p id="status" class="alert alert-warning"></p>
        <section class="row g-3 mb-4" id="cards"></section>
        <section class="row g-3">
            <div class="col-lg-6">
                <h2 class="h5">开放时间(EChart柱状图)</h2>
                <div id="bar-chart" class="chart-box"></div>
            </div>
            <div class="col-lg-6">
                <h2 class="h5">每栋楼的状态(Chart条形图)</h2>
                <div class="chart-box"><canvas id="line-chart"></canvas></div>
            </div>
        </section>

        <script src="libs/jquery-4.0.0.min.js"></script>
        <script src="libs/bootstrap.bundle.min.js"></script>
        <script src="libs/echarts.min.js"></script>
        <script src="libs/chart.umd.js"></script>
        <script src="app.js"></script>
    </body>
</html>
